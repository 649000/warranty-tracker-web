<header class="app-header">
  <div class="app-header__inner">
    <a class="app-header__brand" routerLink="/warranties" aria-label="Warranty Tracker Dashboard">
      <img
        class="app-header__logo"
        src="/logo.svg"
        width="160"
        height="40"
        alt="Warranty Tracker"
      />
    </a>

    <nav class="app-header__nav" aria-label="Primary">
      <a
        routerLink="/warranties"
        routerLinkActive="app-header__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Dashboard</a
      >
      <a
        routerLink="/warranties/new"
        routerLinkActive="app-header__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Add Product</a
      >
      <a routerLink="/account" routerLinkActive="app-header__link--active">Account Settings</a>
    </nav>

    <div class="app-header__actions">
      <a mat-flat-button color="primary" routerLink="/warranties/new" aria-label="Add Product">
        <mat-icon>add</mat-icon>
        <span class="visually-hidden app-header__add-label">Add Product</span>
      </a>
      <button mat-icon-button type="button" [attr.aria-label]="themeLabel()" (click)="cycleTheme()">
        <mat-icon>{{ themeIcon() }}</mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        [matMenuTriggerFor]="accountMenu"
        aria-label="Account Menu"
      >
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #accountMenu="matMenu">
        <button mat-menu-item disabled>
          <span class="menu-email">{{ userEmail() }}</span>
        </button>
        <button mat-menu-item routerLink="/account">
          <mat-icon>settings</mat-icon>
          <span>Account Settings</span>
        </button>
        <button mat-menu-item (click)="signOut()">
          <mat-icon>logout</mat-icon>
          <span>Sign Out</span>
        </button>
        <button mat-menu-item class="danger" (click)="deleteAccount()">
          <mat-icon>delete_forever</mat-icon>
          <span>Delete Account</span>
        </button>
      </mat-menu>
    </div>
  </div>
</header>
<main class="shell-content">
  <router-outlet />
</main>
