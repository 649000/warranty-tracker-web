<mat-toolbar color="primary">
  <button mat-button routerLink="/warranties" class="brand">
    <mat-icon aria-hidden="true">verified_user</mat-icon>
    <span class="brand-text u-truncate">Warranty Tracker</span>
  </button>
  <span class="spacer"></span>
  <button mat-icon-button [attr.aria-label]="themeLabel()" (click)="cycleTheme()">
    <mat-icon>{{ themeIcon() }}</mat-icon>
  </button>
  <button mat-icon-button [matMenuTriggerFor]="accountMenu" aria-label="Account menu">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #accountMenu="matMenu">
    <button mat-menu-item disabled>
      <span class="menu-email">{{ userEmail() }}</span>
    </button>
    <button mat-menu-item (click)="signOut()">
      <mat-icon>logout</mat-icon>
      <span>Sign out</span>
    </button>
    <button mat-menu-item class="danger" (click)="deleteAccount()">
      <mat-icon>delete_forever</mat-icon>
      <span>Delete account</span>
    </button>
  </mat-menu>
</mat-toolbar>
<main class="shell-content">
  <router-outlet />
</main>
