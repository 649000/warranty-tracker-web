<main>
  <h1 class="visually-hidden">Choose a New Password</h1>
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Choose a New Password</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full">
          <mat-label>New Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
          @if (form.controls.password.hasError('required') && form.controls.password.touched) {
            <mat-error>Password Is Required</mat-error>
          } @else if (form.controls.password.hasError('minlength')) {
            <mat-error>Use at Least 6 Characters</mat-error>
          }
        </mat-form-field>
        <button mat-flat-button color="primary" class="full" type="submit" [disabled]="loading()">
          Update Password
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
