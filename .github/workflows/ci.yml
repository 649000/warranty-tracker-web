name: CI

on:
  push:
    branches: [angular]
  pull_request:

jobs:
  quality:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Build
        run: npm run build
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Build Functions
        run: npm run build --prefix functions
      - name: Functions unit tests
        run: npm test --prefix functions

  firebase:
    name: Firebase emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Firestore security-rules tests
        run: npm run test:rules
      - name: Functions emulator integration tests
        run: npm run test:functions:emulator

  deploy:
    name: Deploy to Firebase Hosting
    if: github.ref == 'refs/heads/angular'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Build Functions
        run: npm run build --prefix functions
      - name: Authenticate to Google Cloud
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"
      - name: Deploy
        run: |
          npx firebase-tools deploy \
            --only hosting,functions,firestore,storage \
            --non-interactive
